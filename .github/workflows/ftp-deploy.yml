name: Deploy por FTP

# Cada push a main sube el contenido del repositorio al servidor por FTP.
# Las credenciales viven en GitHub → Settings → Secrets and variables → Actions,
# nunca en este archivo.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ftp-deploy:
    name: Subir al servidor
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # carpeta remota donde vive la web; si el hosting usa otra
          # (p.ej. "public_html/"), creá el secret FTP_SERVER_DIR con ese valor
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/ciudad.html
