name: Despliegue por FTP

# El sitio no tiene nada que compilar: index.html es un único archivo
# autocontenido (HTML + CSS + JS + fuentes en base64). Por eso hay un solo
# job, que arma en dist/ exactamente lo que debe quedar público: separa el
# sitio de los archivos que sólo importan al repositorio (README, .gitignore,
# este mismo workflow, y ciudad.html, que es la versión recortada para pegar
# en el visor de Artifacts de Claude, no para publicar).
#
# Las credenciales viven en GitHub → Settings → Secrets and variables →
# Actions, nunca en este archivo.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # FTP_SERVER / FTP_USERNAME / FTP_PASSWORD viven en este entorno, no como
    # secrets del repositorio: sin declarar el entorno acá, el job no los ve
    # y la acción de FTP falla con "Input required and not supplied".
    environment: "CPanel Variables"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Armar los archivos estáticos a publicar
        run: |
          set -e
          mkdir -p dist
          cp index.html dist/
          cp LEEME.txt dist/
          cp -r DXF dist/
          echo "--- contenido de dist/ ---"
          find dist -type f | sort

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # cPanel (Namecheap) sirve el dominio principal desde public_html/,
          # así que ese es el valor por defecto. Si la cuenta FTP ya nace
          # encerrada ahí adentro (se elige un "Directory" al crearla en
          # cPanel → FTP Accounts), creá el secret FTP_SERVER_DIR con "./"
          # para no terminar subiendo a public_html/public_html/.
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          local-dir: dist/
