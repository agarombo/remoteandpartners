/* ============================================================
   CIUDAD REMOTE & PARTNERS — tokens
   Colores tomados del manual de marca: magenta #ED23AD, púrpura
   #D57FFB, azul #53AAFD, coral #FF5148, naranja #E76D32,
   rosa #FBA3B4 y el navy #242E3D / #161A28 de los neutros.
   Toda la escena SVG lee estas variables, por eso el tema
   oscuro funciona sin tocar el generador.
   ============================================================ */
:root{
  --sky-0:#F4F5F9; --haze:#FFFFFF; --star-op:0;
  --ink:#242E3D; --ink-soft:#6E7688; --line:#A4ABC3; --line-op:.55;

  --stone-1:#FFFFFF; --stone-2:#EBEDF3; --stone-3:#DADDE6; --stone-4:#A4ABC3;
  --magenta-1:#F8A0DA; --magenta-2:#F25AC4; --magenta-3:#ED23AD; --magenta-4:#B01881;
  --purple-1:#E6BEFD; --purple-2:#D57FFB; --purple-3:#B94FEE; --purple-4:#8E2FBD;
  --blue-1:#A9D2FE; --blue-2:#7ABDFE; --blue-3:#53AAFD; --blue-4:#2A7FD0;
  --orange-1:#F7B78F; --orange-2:#EF9159; --orange-3:#E76D32; --orange-4:#AF4B1B;
  --coral-1:#FFACA5; --coral-2:#FF7D73; --coral-3:#FF5148; --coral-4:#C5322A;
  --pulse:var(--coral-3);
  --slate-1:#C9CEDC; --slate-2:#AAB1C4; --slate-3:#8B94AC; --slate-4:#6E7688;
  --coral:#FF5148; --orange:#E76D32; --pink:#FBA3B4;
  --logo-a:#ED23AD; --logo-b:#E76D32; --mark-a:#ED23AD; --mark-b:#E76D32;

  --panel:rgba(255,255,255,.84); --panel-line:rgba(36,46,61,.13);
  --edge:rgba(36,46,61,.10);
}
/* ============================================================
   ASPECTOS — data-look selecciona el aspecto; la entrada usa light.
   ============================================================ */
/* maqueta: la ciudad como modelo físico fotografiado en estudio. Fondo de
   papel cálido, PVC mate para lo neutro, tilo para lo que era gris, y los
   colores de distrito pasados por el mismo filtro de material. */

  --sky-0:#E4DCD0; --sky-hi:#F0EAE0; --sky-lo:#D6CCBE; --haze:#F4EFE7; --star-op:0;
  --ink:#3A342C; --ink-soft:#8A8074; --line:#B9AE9F; --line-op:.6;

  --slate-1:#EAD9BE; --slate-2:#D9C3A1; --slate-3:#C3A983; --slate-4:#9C8666;
  --magenta-1:#F0C9C2; --magenta-2:#E1A79E; --magenta-3:#CA837A; --magenta-4:#9E5E56;
  --purple-1:#E0D0DC; --purple-2:#C8B0C4; --purple-3:#AA8CA6; --purple-4:#7F6680;
  --blue-1:#D0D9DF; --blue-2:#AFC0CA; --blue-3:#8CA2AF; --blue-4:#667D8A;
  --orange-1:#F1D9B9; --orange-2:#E3BF90; --orange-3:#CCA16B; --orange-4:#9E7847;
  --coral-1:#F1C5B1; --coral-2:#E29F83; --coral-3:#CA7D5D; --coral-4:#9C5A3F;
  --coral:#CA7D5D; --orange:#CCA16B; --pink:#F0C9C2;
  --logo-a:#CA837A; --logo-b:#CCA16B; --mark-a:#CA837A; --mark-b:#CCA16B;
  --pulse:#CA7D5D;
  --panel:rgba(246,241,233,.86); --panel-line:rgba(58,52,44,.14); --edge:rgba(58,52,44,.10);
  --scen:.72; --shd-op:.22; --edge-f:rgba(58,52,44,.13);
}
:root[data-look="light"]{
  --sky-0:#F4F5F9; --haze:#FFFFFF; --star-op:0;
  --ink:#242E3D; --ink-soft:#6E7688; --line:#A4ABC3; --line-op:.55;
  --stone-1:#FFFFFF; --stone-2:#EBEDF3; --stone-3:#DADDE6; --stone-4:#A4ABC3;
  --magenta-1:#F8A0DA; --magenta-2:#F25AC4; --magenta-3:#ED23AD; --magenta-4:#B01881;
  --purple-1:#E6BEFD; --purple-2:#D57FFB; --purple-3:#B94FEE; --purple-4:#8E2FBD;
  --blue-1:#A9D2FE; --blue-2:#7ABDFE; --blue-3:#53AAFD; --blue-4:#2A7FD0;
  --orange-1:#F7B78F; --orange-2:#EF9159; --orange-3:#E76D32; --orange-4:#AF4B1B;
  --coral-1:#FFACA5; --coral-2:#FF7D73; --coral-3:#FF5148; --coral-4:#C5322A;
  --slate-1:#C9CEDC; --slate-2:#AAB1C4; --slate-3:#8B94AC; --slate-4:#6E7688;
  --coral:#FF5148; --orange:#E76D32; --pink:#FBA3B4;
  --logo-a:#ED23AD; --logo-b:#E76D32; --mark-a:#ED23AD; --mark-b:#E76D32;
  --panel:rgba(255,255,255,.84); --panel-line:rgba(36,46,61,.13); --edge:rgba(36,46,61,.10);
  --scen:.40;
  --sky-hi:#FBFBFD; --sky-lo:#E9EBF1; --shd-op:.19; --edge-f:rgba(36,46,61,.14);
}
/* apagado: fondo blanco y la marca casi en gris; el color queda para lo activo */
:root[data-look="soft"]{
  --sky-0:#FFFFFF; --haze:#F3F4F7; --star-op:0;
  --ink:#2B3038; --ink-soft:#8A9099; --line:#C3C8CF; --line-op:.6;
  --stone-1:#FFFFFF; --stone-2:#F2F3F5; --stone-3:#E4E6EA; --stone-4:#B9BEC6;
  --magenta-1:#EACADE; --magenta-2:#D8A8C6; --magenta-3:#C285AB; --magenta-4:#9C6688;
  --purple-1:#D8D0EA; --purple-2:#BFB4D9; --purple-3:#A294C4; --purple-4:#7E71A1;
  --blue-1:#CAD7E8; --blue-2:#A8BCD5; --blue-3:#889FBF; --blue-4:#657C9D;
  --orange-1:#ECD1BD; --orange-2:#DCB498; --orange-3:#C69574; --orange-4:#9E7153;
  --coral-1:#F0C9C4; --coral-2:#E1A8A1; --coral-3:#CD857D; --coral-4:#A7625A;
  --slate-1:#DEE1E5; --slate-2:#C6CAD1; --slate-3:#A9AFB8; --slate-4:#89909A;
  --coral:#CD857D; --orange:#C69574; --pink:#EACADE;
  --logo-a:#C285AB; --logo-b:#C69574;
  --panel:rgba(255,255,255,.9); --panel-line:rgba(43,48,56,.12); --edge:rgba(43,48,56,.09);
  --scen:.40;
  --sky-hi:#FFFFFF; --sky-lo:#EEEFF2; --shd-op:.15; --edge-f:rgba(43,48,56,.12);
}
:root[data-look="dark"]{
  --sky-0:#161A28; --haze:#33305C; --star-op:.9;
  --ink:#EDEFF5; --ink-soft:#98A0B4; --line:#4C5670; --line-op:.75;
  --stone-1:#343B4E; --stone-2:#2A3042; --stone-3:#1F2534; --stone-4:#4C5670;
  --magenta-1:#E86BC5; --magenta-2:#C64AA2; --magenta-3:#9C3480; --magenta-4:#F79FDD;
  --purple-1:#C08CF0; --purple-2:#9E63D6; --purple-3:#7B45AE; --purple-4:#DDB4FB;
  --blue-1:#6FAFF0; --blue-2:#4E8CCE; --blue-3:#3A6BA4; --blue-4:#96CBFD;
  --orange-1:#DC7F45; --orange-2:#B66132; --orange-3:#8D4823; --orange-4:#F4A876;
  --coral-1:#EB786F; --coral-2:#C35A52; --coral-3:#99413A; --coral-4:#FFA9A1;
  --slate-1:#5A6480; --slate-2:#48516A; --slate-3:#3A4258; --slate-4:#7D87A3;
  --coral:#FF6A62; --orange:#F0813F; --pink:#F3A6B6;
  --logo-a:#ED23AD; --logo-b:#E76D32; --mark-a:#ED23AD; --mark-b:#E76D32;
  --panel:rgba(22,26,40,.84); --panel-line:rgba(237,239,245,.14); --edge:rgba(237,239,245,.12);
  --scen:.30;
  --sky-hi:#1E2436; --sky-lo:#111420; --shd-op:.38; --edge-f:rgba(237,239,245,.10);
}
/* blanco y negro: la ciudad entera en valores, sin un solo tono de marca.
   Los distritos se separan del paisaje por claridad, no por color. */
:root[data-look="bw"]{
  --sky-0:#0D0E10; --haze:#222428; --star-op:.95;
  --ink:#F1F2F4; --ink-soft:#8E9195; --line:#4E5257; --line-op:.8;
  --stone-1:#33363B; --stone-2:#282B2F; --stone-3:#1D2023; --stone-4:#5A5E64;
  --slate-1:#3C4045; --slate-2:#303338; --slate-3:#25282B; --slate-4:#6B7076;
  --magenta-1:#DCDEE2; --magenta-2:#B2B5BA; --magenta-3:#878B91; --magenta-4:#F2F3F5;
  --purple-1:#DCDEE2; --purple-2:#B2B5BA; --purple-3:#878B91; --purple-4:#F2F3F5;
  --blue-1:#DCDEE2; --blue-2:#B2B5BA; --blue-3:#878B91; --blue-4:#F2F3F5;
  --orange-1:#DCDEE2; --orange-2:#B2B5BA; --orange-3:#878B91; --orange-4:#F2F3F5;
  --coral-1:#DCDEE2; --coral-2:#B2B5BA; --coral-3:#878B91; --coral-4:#F2F3F5;
  --coral:#DCDEE2; --orange:#B2B5BA; --pink:#DCDEE2;
  --logo-a:#E6E8EB; --logo-b:#9EA2A7; --mark-a:#FFFFFF; --mark-b:#C9CCD0;
  --pulse:#FFFFFF;
  --panel:rgba(13,14,16,.86); --panel-line:rgba(241,242,244,.15); --edge:rgba(241,242,244,.12);
  --scen:.26;
  --sky-hi:#16181B; --sky-lo:#0A0B0D; --shd-op:.45;
}
/* en B/N la señal viva va en blanco y un punto más gruesa: el coral no
   existe en esta paleta y el gris se perdía contra el cielo casi negro */
:root[data-look="bw"] .shockring{ stroke-width:2.2; }
:root[data-look="bw"] .un-beam{ stroke-width:1.5; }
/* la isla donde aterrizás se enciende en blanco */
:root[data-look="bw"] .isl.focus{
  --magenta-1:#FFFFFF; --magenta-2:#DDE0E4; --magenta-3:#AFB3B9;
  --purple-1:#FFFFFF; --purple-2:#DDE0E4; --purple-3:#AFB3B9;
  --blue-1:#FFFFFF; --blue-2:#DDE0E4; --blue-3:#AFB3B9;
  --orange-1:#FFFFFF; --orange-2:#DDE0E4; --orange-3:#AFB3B9;
  --coral-1:#FFFFFF; --coral-2:#DDE0E4; --coral-3:#AFB3B9;
}

/* en el aspecto apagado, lo que está activo recupera el color pleno */
:root[data-look="soft"] .isl.focus,
:root[data-look="soft"] .panel,
:root[data-look="soft"] .lab,
:root[data-look="soft"] nav.dist button[aria-current="true"]{
  --magenta-1:#F8A0DA; --magenta-2:#F25AC4; --magenta-3:#ED23AD; --magenta-4:#B01881;
  --purple-1:#E6BEFD; --purple-2:#D57FFB; --purple-3:#B94FEE; --purple-4:#8E2FBD;
  --blue-1:#A9D2FE; --blue-2:#7ABDFE; --blue-3:#53AAFD; --blue-4:#2A7FD0;
  --orange-1:#F7B78F; --orange-2:#EF9159; --orange-3:#E76D32; --orange-4:#AF4B1B;
  --coral-1:#FFACA5; --coral-2:#FF7D73; --coral-3:#FF5148; --coral-4:#C5322A;
}

*{ box-sizing:border-box; }
body{
  margin:0; background:var(--sky-0); color:var(--ink);
  font-family:"Metropolis","Avenir Next",system-ui,sans-serif; font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.app{ position:fixed; inset:0; isolation:isolate; overflow:hidden; }

/* ---------- escena ---------- */
#stage{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
.scene-background, .scene-optics, .scene-labels{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
/* Cache full-screen filters independently from the moving geometry. */
.scene-background, .scene-optics{ transform:translateZ(0); }
#cameraLayer{ position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
#stage{ overflow:visible; }
/* todo el trazo de la escena va a grosor constante: si se escalara con la
   cámara desaparecería al alejarse y engordaría al aterrizar */
#islands polygon, #islands line, #islands path, #islands polyline,
#islands rect, #islands circle, #islands ellipse,
#ships line, #ships rect{ vector-effect:non-scaling-stroke; }
/* las aristas las dibuja la luz, no una línea: apenas un hilo translúcido */
.f{ stroke:var(--edge-f,var(--stone-4)); stroke-width:.45; stroke-linejoin:round; }
/* brillo especular en las aristas que miran al foco */
.hl{ fill:none; stroke:#fff; stroke-opacity:var(--hl-op,.42); stroke-width:.55; stroke-linejoin:round; stroke-linecap:round; pointer-events:none; }
/* sombras arrojadas sobre la losa, con su halo de contacto en la base */
.shd{ fill:var(--ink); opacity:var(--shd-op,.14); filter:url(#shd); pointer-events:none; }
.shd .ao{ opacity:.7; }
/* la textura de fachada se revela al aterrizar, como el resto del detalle */
.tex{ opacity:0; transition:opacity .6s ease .2s; pointer-events:none; }
.isl.focus .tex{ opacity:1; }
/* placa de maqueta en el zócalo */
.plq-bg{ fill:var(--stone-1); stroke:var(--edge-f,var(--stone-4)); stroke-width:.02; }
.plq-t{ font-family:"IBM Plex Mono",monospace; fill:var(--ink-soft); letter-spacing:.06em; }
.plq-t.b{ fill:var(--ink); font-weight:600; }
/* figuras de escala: blancas, mate, como las de una maqueta */
.fig{ fill:var(--stone-1); stroke:var(--ink-soft); stroke-width:.35; }
/* las que caminan van y vuelven por la acera, cada una a su paso */
.walk{ animation:walk var(--dur,18s) linear var(--del,0s) infinite alternate; }
@keyframes walk{ to{ transform:translate(var(--wx),var(--wy)); } }
.isl{ cursor:pointer; }
.isl:focus{ outline:none; }
.isl:focus-visible .ring{ opacity:1; }
.ring{ opacity:0; fill:none; stroke:var(--ink); stroke-width:1.5; stroke-dasharray:3 5; vector-effect:non-scaling-stroke; transition:opacity .2s; }
.frame{ opacity:0; fill:none; stroke:var(--purple-3); stroke-width:1.2; stroke-dasharray:5 5; vector-effect:non-scaling-stroke; transition:opacity .5s ease .25s; }
.isl.focus .frame{ opacity:.85; }
.detail{ opacity:0; transition:opacity .45s ease .3s; }
.isl.focus .detail{ opacity:1; }
/* acotaciones y ejes de replanteo: sólo legibles con la cámara abajo */
.tech{ opacity:0; transition:opacity .5s ease .4s; }
.isl.focus .tech{ opacity:.9; }
.tech text{ font-family:"IBM Plex Mono",monospace; font-size:5.4px; letter-spacing:.04em;
            fill:var(--ink-soft); font-variant-numeric:tabular-nums; }
.glow{ opacity:0; transition:opacity .4s ease; }
.isl.hot .glow{ opacity:.55; }
.link{ stroke:var(--line); stroke-opacity:var(--line-op); stroke-width:1; vector-effect:non-scaling-stroke; fill:none; transition:stroke-opacity .4s, stroke .4s; }
.link.hot{ stroke:var(--purple-3); stroke-opacity:1; }
/* el paisaje queda al fondo salvo que el relato lo encienda */
#islands .isl.scenery:not(.dimmed):not(.built){ opacity:var(--scen,.34); }
.dimmed{ opacity:.10; }
/* la isla que no es la abierta deja de ofrecerse: ni cursor ni realce */
#islands .isl.dimmed{ cursor:default; }
.isl, .link, #tags > g{ transition:opacity .55s ease; }

/* ---------- rótulos de distrito (espacio de pantalla) ---------- */
#tags > g{ opacity:0; pointer-events:none; }
#tags > g.on{ opacity:1; }
.tag-line{ stroke-width:1; stroke-dasharray:2 4; }
.tag-name{
  font-family:"Metropolis",system-ui,sans-serif;
  font-weight:600; font-size:15px; letter-spacing:.16em; text-anchor:middle;
}
.tag-sub{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9px;
  letter-spacing:.22em; text-anchor:middle; fill:var(--ink-soft);
}

/* ---------- HUD ---------- */
.hud{ position:absolute; inset:0; pointer-events:none; padding:clamp(18px,3vw,34px); display:flex; flex-direction:column; justify-content:space-between; }
.hud > div{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; }
/* lockup de marca: isotipo vectorial del manual + logotipo en Metropolis */
.brand{ pointer-events:auto; text-decoration:none; color:inherit; display:flex; align-items:center; gap:11px; }
.brand .mark{ width:36px; height:36px; display:block; flex:none; }
.brand .word{ display:flex; flex-direction:column; gap:4px; }
.brand b{ font-weight:500; font-size:23px; line-height:.86; letter-spacing:-.004em; color:var(--ink); }
.brand i{ font-style:normal; font-weight:500; font-size:9.5px; letter-spacing:.295em; color:var(--coral); }
.mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; letter-spacing:.16em; color:var(--ink-soft); }

nav.dist{ pointer-events:auto; display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
nav.dist button{
  appearance:none; background:none; border:0; cursor:pointer; color:var(--ink-soft);
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.20em;
  padding:5px 0 5px 14px; display:flex; align-items:center; gap:9px;
  transition:color .25s;
}
nav.dist button i{ width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.5; transition:opacity .25s, transform .25s; }
nav.dist button:hover, nav.dist button:focus-visible, nav.dist button[aria-current="true"]{ color:var(--ink); outline:none; }
nav.dist button:hover i, nav.dist button:focus-visible i, nav.dist button[aria-current="true"] i{ opacity:1; transform:scale(1.6); }
nav.dist button.c-magenta i{ color:var(--magenta-3); }
nav.dist button.c-purple i{ color:var(--purple-3); }
nav.dist button.c-blue i{ color:var(--blue-3); }
nav.dist button.c-orange i{ color:var(--orange-3); }

/* ---------- nodo de conexión, arriba al centro ----------
   no es un botón: es un nodo disponible que late cada tanto */
.connect{ position:absolute; top:clamp(18px,3vw,34px); left:50%; transform:translateX(-50%);
          appearance:none; background:none; border:0; cursor:pointer; pointer-events:auto;
          display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 10px; }
.connect .cdot{ width:7px; height:7px; border-radius:50%; background:var(--pulse); position:relative; }
.connect .cdot::after{ content:""; position:absolute; inset:-3px; border-radius:50%;
                       border:1px solid var(--pulse); opacity:0;
                       animation:nodePulse 2.4s cubic-bezier(.2,.7,.3,1) infinite; }
@keyframes nodePulse{ 0%{ transform:scale(.6); opacity:0; } 8%{ opacity:.9; }                      34%{ transform:scale(3.2); opacity:0; } 100%{ opacity:0; } }
.connect .clabel{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.24em; text-indent:.24em;
                  color:var(--ink); transition:color .25s; }
.connect .csub{ font-family:"IBM Plex Mono",monospace; font-size:8.5px; letter-spacing:.2em; text-indent:.2em;
                color:var(--ink-soft); opacity:0; transform:translateY(-3px);
                transition:opacity .3s, transform .3s; }
.connect:hover .csub, .connect:focus-visible .csub, .connect.live .csub{ opacity:1; transform:none; }
.connect .cshort{ display:none; }
.connect:focus-visible{ outline:none; }
.connect:hover .cdot, .connect.live .cdot{ box-shadow:0 0 0 4px color-mix(in srgb, var(--pulse) 22%, transparent); }
.connect.busy .clabel{ animation:blink .9s steps(2) infinite; }
/* con el nodo activo, la llamada a la acción late para no pasar inadvertida */
.connect.live:not(.busy) .clabel{ animation:softBlink 1.6s ease-in-out infinite; }
@keyframes softBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
@keyframes blink{ 50%{ opacity:.35; } }

/* pulsos y nodo del visitante */
.pulse{ fill:var(--pulse); }
/* el halo: tres anillos que salen del centro cuando la conexión cierra */
#shock{ opacity:0; }
#shock.go{ opacity:1; }
.shockring{ fill:none; stroke:var(--pulse); stroke-width:1.6;
            vector-effect:non-scaling-stroke; opacity:0; }
#shock.go .shockring{ animation:shockOut 1.7s cubic-bezier(.12,.68,.28,1) forwards; }
#shock.go .shockring:nth-child(2){ animation-delay:.18s; }
#shock.go .shockring:nth-child(3){ animation-delay:.36s; }
@keyframes shockOut{ 0%{ transform:scale(.12); opacity:.9; }
                     60%{ opacity:.35; }
                     100%{ transform:scale(21); opacity:0; } }
#islands.recede{ opacity:.4; transition:opacity .5s ease; }
.link.carrying{ stroke:var(--pulse); stroke-opacity:.85; }
#usernode{ opacity:0; pointer-events:none; transition:opacity .8s ease; }
/* el nodo recién conectado late: es lo último que ha entrado en la red */
#usernode.on .f{ animation:nodeBlink 1.9s ease-in-out infinite; }
/* el mismo latido que el punto de CONNECT: el anillo crece y se difumina */
.un-halo{ fill:none; stroke:var(--pulse); stroke-width:1.3; vector-effect:non-scaling-stroke;
          opacity:0; transform-box:fill-box; transform-origin:center; }
#usernode.on .un-halo{ animation:haloPulse 2.4s cubic-bezier(.2,.7,.3,1) infinite; }
#usernode.on .un-halo.b{ animation-delay:1.2s; }
@keyframes haloPulse{ 0%{ transform:scale(.5); opacity:0; } 8%{ opacity:.9; }
                      34%{ transform:scale(3); opacity:0; } 100%{ opacity:0; } }
@keyframes nodeBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
#usernode.on{ opacity:1; }
.un-beam{ stroke:var(--pulse); stroke-width:1.2; vector-effect:non-scaling-stroke; }
.un-tip{ fill:var(--pulse); }
.un-link{ stroke:var(--pulse); stroke-width:1; stroke-dasharray:3 4;
          vector-effect:non-scaling-stroke; opacity:.7; }

/* ---------- formulario de la conexión ---------- */
.fields{ display:flex; flex-direction:column; gap:14px; }
.fields label, .area{ display:flex; flex-direction:column; gap:6px; }
.fields input, .area textarea{ appearance:none; background:none; color:var(--ink);
   border:0; border-bottom:1px solid var(--panel-line); padding:7px 0;
   font-family:"Metropolis",sans-serif; font-size:15px; transition:border-color .25s; }
.fields input:focus, .area textarea:focus{ outline:none; border-color:var(--accent,var(--ink)); }
.area textarea{ border:1px solid var(--panel-line); border-radius:3px; padding:10px 12px; resize:vertical; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ appearance:none; background:none; cursor:pointer; color:var(--ink-soft);
       border:1px solid var(--panel-line); border-radius:100px; padding:8px 14px;
       font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.16em;
       transition:border-color .2s, color .2s, background .2s; }
.chip[aria-pressed="true"]{ color:var(--sky-0); background:var(--accent,var(--ink)); border-color:transparent; }
.block.wide{ grid-template-columns:repeat(2,1fr); }
.callmini{ align-self:flex-start; text-decoration:none; color:var(--ink-soft);
           border-bottom:1px solid var(--panel-line); padding-bottom:4px;
           transition:color .25s, border-color .25s; }
.callmini:hover, .callmini:focus-visible{ color:var(--accent,var(--ink)); border-color:var(--accent,var(--ink)); outline:none; }

/* ---------- mapa operativo ----------
   al entrar en WORK la ciudad se apaga y aparece el territorio */
#usmap, #typo{ opacity:0; pointer-events:none; transition:opacity .9s ease; }
body.mapmode #usmap, body.mapmode #typo{ opacity:1; pointer-events:auto; }
#usmap.hide, #typo.hide{ opacity:0 !important; pointer-events:none !important; }
body.mapmode #islands, body.mapmode #links, body.mapmode #ships,
body.mapmode #tags, body.mapmode #usernode{ opacity:0; pointer-events:none; }
#islands, #links, #ships{ transition:opacity .8s ease; }

.st{ cursor:default; }
.st.on{ cursor:pointer; }
.st.on:focus{ outline:none; }
.st polygon{ transition:opacity .3s ease; }
.st.on:hover, .st.on:focus-visible, .st.sel{ filter:brightness(1.12); }
.st-cell{ fill:var(--stone-2); stroke:var(--line); stroke-width:.8; }
.st-cell.on{ fill:var(--blue-4); stroke:var(--blue-3); stroke-width:1.1; }
.st.on:hover .st-cell, .st.on:focus-visible .st-cell{ fill:var(--blue-3); }
.st-code{ font-family:"IBM Plex Mono",monospace; font-size:6px; letter-spacing:.08em;
          fill:var(--sky-0); text-anchor:start; }
.st.sel .st-code{ font-weight:500; }

.ty{ cursor:pointer; }
.ty:focus{ outline:none; }
.ty-plate{ fill:var(--blue-1); opacity:.14; transition:opacity .3s ease; }
.ty:hover .ty-plate, .ty:focus-visible .ty-plate, .ty.sel .ty-plate{ opacity:.42; }
.ty-lead{ stroke:var(--ink-soft); stroke-width:.8; vector-effect:non-scaling-stroke; opacity:.5; }
.ty-dot{ fill:var(--ink-soft); opacity:.7; }
.ty.sel .ty-lead, .ty.sel .ty-dot{ stroke:var(--blue-3); fill:var(--blue-3); opacity:1; }
.ty-name{ font-family:"IBM Plex Mono",monospace; font-size:7px; letter-spacing:.18em;
          fill:var(--ink-soft); }
.ty.sel .ty-name{ fill:var(--blue-4); }

.modes{ display:flex; gap:4px; }
.modes button{ appearance:none; background:none; cursor:pointer; flex:1;
   border:1px solid var(--panel-line); color:var(--ink-soft); padding:11px 8px;
   font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.18em;
   transition:background .25s, color .25s, border-color .25s; }
.modes button:first-child{ border-radius:100px 0 0 100px; }
.modes button:last-child{ border-radius:0 100px 100px 0; }
.modes button[aria-current="true"]{ color:var(--sky-0); background:var(--accent,var(--ink)); border-color:transparent; }
.modes button:focus-visible{ outline:none; color:var(--ink); }

/* hilos que unen el territorio con la ciudad, y el aviso de tránsito */

/* terminal de partida de la isla WORK */
.pad-ring, .pad-ring2{ fill:none; stroke:var(--blue-3); stroke-width:1.1;
                        vector-effect:non-scaling-stroke; opacity:.55; }
.pad-ring{ stroke-dasharray:6 4; }
.pad-tick{ stroke:var(--blue-3); stroke-width:1.4; vector-effect:non-scaling-stroke; opacity:.5; }
.pad-mark{ fill:var(--blue-3); opacity:.35; stroke:none; }
.mast{ stroke:var(--stone-4); stroke-width:.9; vector-effect:non-scaling-stroke; }
.beacon{ fill:var(--pulse); animation:padBlink 1.8s ease-in-out infinite; }
.padlight{ fill:var(--pulse); opacity:.75; animation:padBlink 1.8s ease-in-out infinite; }
.padlight:nth-of-type(2){ animation-delay:.6s; }
@keyframes padBlink{ 0%,100%{ opacity:1; } 50%{ opacity:.2; } }
.traj{ stroke:var(--blue-3); stroke-width:1; stroke-dasharray:4 5;
       vector-effect:non-scaling-stroke; opacity:.55; }
.traj-tip{ fill:var(--blue-3); opacity:.55; }
.hq-dot{ fill:var(--blue-3); }
.hq-txt{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.18em; fill:var(--ink-soft); }
.tot-n{ font-family:"Metropolis",sans-serif; font-weight:600; font-size:54px; letter-spacing:-.02em; fill:var(--ink); }
.tot-l{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.24em; fill:var(--ink-soft); }
/* ---------- origen: la ciudad se construye ---------- */
body.originmode #islands .isl, body.originmode #links .link{ opacity:0; transition:opacity .7s ease; }
body.originmode #islands .isl.built{ opacity:1; }
body.originmode #links .link.built{ opacity:1; }
body.originmode #ships, body.originmode #tags{ opacity:0; pointer-events:none; }
/* al mirar la red, los edificios se apagan y quedan los hilos */
body.originmode.wiremode #islands .isl.built{ opacity:.34; }
/* paso 04: lo que importa deja de ser el edificio y pasa a ser el tráfico.
   Las conexiones se vuelven discontinuas, suben de brillo y la trama corre
   en el sentido de cada línea, como circulación. */
body.originmode.wiremode #links .link.built{
  opacity:1; stroke:var(--ink); stroke-opacity:.92; stroke-width:1.35;
  stroke-dasharray:6 7; stroke-linecap:butt;
  animation:linkFlow 1.5s linear infinite;
}
@keyframes linkFlow{ to{ stroke-dashoffset:-13; } }
@media (prefers-reduced-motion: reduce){
  body.originmode.wiremode #links .link.built{ animation:none; }
}
.steps{ display:flex; align-items:center; gap:14px; }
/* el único momento humano de la sección */
.human{ margin:0; display:flex; flex-direction:column; gap:10px; }
.human img{ width:100%; aspect-ratio:16/9; object-fit:cover; object-position:center 22%;
            filter:grayscale(1) contrast(1.05); border:1px solid var(--panel-line); border-radius:3px; }
.human figcaption .mono{ font-size:9px; letter-spacing:.18em; }
.human blockquote{ margin:2px 0 0; font-family:"Metropolis",sans-serif; font-weight:500;
                   font-size:18px; line-height:1.35; letter-spacing:.01em; color:var(--ink); }
.steps .mono{ margin-left:auto; }

/* .hud > div le impone flex-start y gana por especificidad: hay que
   igualarla o el rótulo nunca se centra */
.hud > .mapstatus{ position:absolute; top:calc(clamp(18px,3vw,34px) + 58px); left:50%;
            transform:translateX(-50%); display:flex; flex-direction:column;
            align-items:center; justify-content:flex-start; gap:5px;
            text-align:center; pointer-events:none; width:max-content;
            opacity:0; transition:opacity .4s ease; }
.mapstatus.on{ opacity:1; }
.mapstatus b{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.26em;
              font-weight:400; color:var(--ink); text-indent:.26em; }
.mapstatus span{ font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.22em; text-indent:.22em;
                 color:var(--ink-soft); }

/* ---------- instrumentos de lectura ---------- */
.readout{ display:flex; flex-direction:column; gap:9px; }
.instr{ display:flex; align-items:flex-end; gap:16px; }
.scale{ display:flex; flex-direction:column; gap:5px; }
.scale i{ display:block; height:5px; width:60px; border:1px solid var(--ink-soft);
          border-top:0; opacity:.75; transition:width .2s linear; }
.compass{ width:30px; height:30px; overflow:visible; }
.compass text{ font-family:"IBM Plex Mono",monospace; font-size:7px; letter-spacing:.1em; fill:var(--ink-soft); }

/* marcas de registro en las esquinas, como una lámina de dibujo */
.ticks{ position:absolute; inset:clamp(12px,2vw,22px); pointer-events:none; }
.ticks i{ position:absolute; width:13px; height:13px; border:1px solid var(--ink-soft); opacity:.3; }
.ticks i:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0; }
.ticks i:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0; }
.ticks i:nth-child(3){ bottom:0; left:0; border-right:0; border-top:0; }
.ticks i:nth-child(4){ bottom:0; right:0; border-left:0; border-top:0; }
.hintbar{ display:flex; flex-direction:column; align-items:flex-end; gap:9px; pointer-events:auto; }
.tools{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
.looks{ display:flex; gap:12px; }
.looks button{ appearance:none; background:none; border:0; padding:0; cursor:pointer;
      font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.2em;
      color:var(--ink-soft); opacity:.6; transition:opacity .25s, color .25s; }
.looks button:hover, .looks button:focus-visible{ opacity:1; outline:none; }
.looks button[aria-current="true"]{ color:var(--ink); opacity:1; }
.snd b{ font-weight:500; color:var(--ink); }
.snd.en b{ font-weight:400; color:var(--ink-soft); }
.snd.en span:first-of-type{ color:var(--ink); }
.snd{ appearance:none; background:none; border:0; cursor:pointer; color:var(--ink-soft);
      font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.2em;
      display:flex; align-items:center; gap:8px; padding:0; transition:color .25s; }
.snd i{ font-style:normal; font-size:8px; }
.snd:hover, .snd:focus-visible{ color:var(--ink); outline:none; }
.snd[aria-pressed="false"]{ opacity:.55; }
.hint kbd{
  font-family:"IBM Plex Mono",monospace; font-size:9px; border:1px solid var(--edge);
  border-radius:3px; padding:2px 5px; margin:0 2px;
}

/* ---------- llamadas de detalle sobre la isla ---------- */
.call{ cursor:pointer; opacity:0; pointer-events:none; transition:opacity .5s ease .45s; }
.isl.focus .call{ opacity:1; pointer-events:auto; }
.isl.mode-cut .call, .isl.mode-bim .call{ opacity:0; pointer-events:none; }
.call-line{ stroke:var(--coral); stroke-width:1.1; fill:none; vector-effect:non-scaling-stroke; }
.call-dot{ fill:var(--coral); }
.call-bub{ fill:var(--sky-0); stroke:var(--coral); stroke-width:1.1; vector-effect:non-scaling-stroke;
           transition:fill .25s; }
.call-num{ font-family:"IBM Plex Mono",monospace; font-size:6.5px; fill:var(--coral); text-anchor:middle; }
.call-name{ font-family:"Metropolis",sans-serif; font-weight:600; font-size:8.5px;
            letter-spacing:.13em; fill:var(--coral); }
.call:hover .call-bub, .call:focus-visible .call-bub{ fill:var(--coral); }
.call:hover .call-num, .call:focus-visible .call-num{ fill:var(--sky-0); }
.call:focus{ outline:none; }

/* ---------- barra de obra: la ciudad sigue detrás ---------- */
.lab{ position:absolute; left:0; right:0; bottom:0; z-index:40;
      background:color-mix(in srgb,var(--panel) 30%,var(--sky-0));
      border-top:1px solid var(--panel-line);
      display:flex; align-items:flex-end; gap:clamp(18px,2.6vw,40px);
      padding:clamp(16px,2vw,24px) clamp(18px,3vw,34px); flex-wrap:wrap;
      transform:translateY(103%); transition:transform .7s cubic-bezier(.22,.9,.24,1);
      pointer-events:none; }
.lab.on{ transform:none; pointer-events:auto; }
.lab-head{ margin-right:auto; }
.lab-head h3{ font-family:"Metropolis",sans-serif; font-weight:600; letter-spacing:.03em;
              font-size:clamp(19px,2.2vw,26px); line-height:1; margin:8px 0 0; }
.lab-btn{ appearance:none; background:none; cursor:pointer; color:var(--ink);
          border:1px solid var(--panel-line); border-radius:100px; padding:10px 18px;
          font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.18em;
          transition:background .25s, border-color .25s, color .25s; white-space:nowrap; }
.lab-btn:hover, .lab-btn:focus-visible{ background:var(--edge); border-color:var(--ink-soft); outline:none; }
.lab-btn[disabled]{ opacity:.35; cursor:default; }
.lab-btn.go{ border-color:var(--accent); color:var(--accent); }

/* recorrido de láminas */
.sheets{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.sheets ol{ list-style:none; margin:0; padding:0; display:flex; gap:18px; flex-wrap:wrap; }
.sheets li{ font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.16em;
            color:var(--ink-soft); display:flex; align-items:center; gap:7px; cursor:pointer;
            transition:color .25s; }
.sheets li b{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.35;
              transition:opacity .25s, transform .25s; }
.sheets li:hover{ color:var(--ink); }
.sheets li[aria-current="true"]{ color:var(--ink); }
.sheets li[aria-current="true"] b{ opacity:1; transform:scale(1.7); }

/* conmutadores de disciplina */
.discs{ display:flex; gap:22px; flex-wrap:wrap; }
.discs button{ appearance:none; background:none; border:0; cursor:pointer; padding:6px 0;
               display:flex; align-items:center; gap:9px; color:var(--ink-soft);
               font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.18em;
               transition:color .25s; }
.discs button u{ width:11px; height:11px; border:1px solid currentColor; border-radius:2px;
                 text-decoration:none; position:relative; }
.discs button[aria-pressed="true"]{ color:var(--ink); }
.discs button[aria-pressed="true"] u{ background:currentColor; }
.discs button:focus-visible{ outline:none; color:var(--ink); }

/* rótulo de lámina */
.block{ border:1px solid var(--panel-line); display:grid; grid-template-columns:repeat(4,auto); }
.block div{ padding:8px 14px; border-left:1px solid var(--panel-line); display:flex; flex-direction:column; gap:4px; }
.block div:first-child{ border-left:0; }
.block dt{ font-family:"IBM Plex Mono",monospace; font-size:8px; letter-spacing:.18em;
           color:var(--ink-soft); margin:0; white-space:nowrap; }
.block dd{ font-family:"Metropolis",sans-serif; font-weight:500; font-size:12px; margin:0;
           letter-spacing:.04em; white-space:nowrap; }

/* ---------- el edificio del proyecto cambia de presentación ---------- */
.proj-cut, .proj-bim{ display:none; }
.isl.mode-cut .proj-solid, .isl.mode-bim .proj-solid{ display:none; }
.isl.mode-cut .proj-cut, .isl.mode-bim .proj-bim{ display:block; }
/* el plano cae sobre la losa; el trazo no se deforma con la proyección */
.plan-g{ transition:transform .95s cubic-bezier(.32,.78,.28,1); }
.cut-3d{ transition:opacity .8s ease; }
.isl.flat .cut-3d{ opacity:.09; }
.plan-poche{ opacity:0; transition:opacity .6s ease .35s; }
.plan-sheet{ fill:var(--sky-0); opacity:0; transition:opacity .6s ease .3s; }
.isl.flat .plan-sheet{ opacity:1; }
.isl.flat .plan-poche{ opacity:1; }
.notes-iso, .notes-flat{ transition:opacity .45s ease; }
.notes-flat{ opacity:0; }
.isl.flat .notes-iso{ opacity:0; }
.isl.flat .notes-flat{ opacity:1; }
.fl-poche{ fill:var(--ink); stroke:none; }
.fl-poche-lite{ fill:var(--ink); opacity:.22; stroke:none; }
.fl-thin{ fill:none; stroke:var(--ink-soft); stroke-width:1.1; }
.fl-fine{ fill:none; stroke:var(--ink-soft); stroke-width:.75; opacity:.8; }
.fl-cut{ fill:none; stroke:var(--ink); stroke-width:1.3; }
.fl-lay{ fill:none; stroke:var(--accent,var(--ink)); stroke-width:1.2; }
.fl-lay-f{ fill:var(--accent,var(--ink)); stroke:none; }
.fl-lay-d{ fill:none; stroke:var(--accent,var(--ink)); stroke-width:1; stroke-dasharray:4 3; }
/* las notas de lámina: sin regla propia salían casi en negro sobre negro */
.fl-lay-t{ font-family:"IBM Plex Mono",monospace; fill:var(--ink); opacity:.88;
           letter-spacing:.004em; paint-order:stroke; stroke:var(--sky-0);
           stroke-width:.012; stroke-linejoin:round; }
/* acotaciones del corte */
.ob-axis{ fill:none; stroke:var(--ink-soft); stroke-width:.7; stroke-dasharray:8 2 1.5 2; opacity:.7; }
.ob-dim{ fill:none; stroke:var(--ink-soft); stroke-width:.8; }
.ob-bub{ fill:var(--sky-0); stroke:var(--ink-soft); stroke-width:.8; }
.ob-txt{ font-family:"IBM Plex Mono",monospace; font-size:2.7px; fill:var(--ink-soft);
         text-anchor:middle; letter-spacing:.05em; }
.ob-room{ font-family:"Metropolis",sans-serif; font-weight:600; font-size:2.35px;
          letter-spacing:.1em; fill:var(--ink); text-anchor:middle; }
.ob-area{ font-family:"IBM Plex Mono",monospace; font-size:2.1px; fill:var(--ink-soft);
          text-anchor:middle; opacity:.85; }


/* ---------- modelo BIM ---------- */

.proj-bim g.lay{ transition:opacity .45s ease; }
.proj-bim .lay-off{ opacity:.13; }
.proj-bim.xray .lay-arc{ opacity:.3; }


/* Flat panel surfaces avoid resampling the moving SVG through backdrop blur. */
/* ---------- panel de distrito ---------- */
.panel{
  position:absolute; top:0; right:0; height:100%; width:min(410px,38vw);
  padding:clamp(24px,4vh,54px) clamp(24px,2.6vw,44px);
  background:color-mix(in srgb,var(--panel) 30%,var(--sky-0));
  border-left:1px solid var(--panel-line);
  display:flex; flex-direction:column; gap:22px; overflow-y:auto;
  transform:translateX(102%); transition:transform .8s cubic-bezier(.22,.9,.24,1);
  pointer-events:none;
}
.panel.open{ transform:none; pointer-events:auto; }
.panel .eyebrow{ display:flex; flex-direction:column; gap:9px; }
.panel h2{
  font-family:"Metropolis",system-ui,sans-serif;
  font-weight:600; font-size:clamp(28px,3.4vw,40px); letter-spacing:.02em;
  margin:0; line-height:1; text-wrap:balance;
}
.panel .sub{ font-weight:300; font-size:16px; letter-spacing:.02em; color:var(--accent,var(--ink-soft)); margin:0; }
.panel p.lead{ font-weight:300; font-size:16.5px; line-height:1.6; margin:0; color:var(--ink); max-width:36em; }
.rule{ height:1px; background:var(--panel-line); border:0; margin:0; }
.cta{ align-self:flex-start; text-decoration:none; border:1px solid var(--accent,var(--ink));
      color:var(--accent,var(--ink)); border-radius:100px; padding:13px 22px;
      font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.18em;
      transition:background .25s, color .25s; }
.cta:hover, .cta:focus-visible{ background:var(--accent,var(--ink)); color:var(--sky-0); outline:none; }
.items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.items li{ padding:13px 0; border-top:1px solid var(--panel-line); display:flex; gap:14px; align-items:baseline; }
.items li:first-child{ border-top:0; }
.items:empty{ display:none; }
.items .lab-btn{ margin-top:12px; }
.items .k{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.14em; color:var(--ink-soft); min-width:26px; font-variant-numeric:tabular-nums; }
.items .t{ font-family:"Metropolis",sans-serif; font-weight:500; font-size:14.5px; letter-spacing:.03em; display:block; }
.items .d{ font-size:14.5px; line-height:1.55; color:var(--ink-soft); display:block; margin-top:3px; }
/* ---------- puestos de trabajo en el edificio abierto ---------- */
.seat{ cursor:pointer; transition:opacity .4s ease; }
.seat:focus{ outline:none; }
.seat-plate{ opacity:.16; transition:opacity .3s ease; }
.seat:hover .seat-plate, .seat.on .seat-plate, .seat:focus-visible .seat-plate{ opacity:.55; }
.seat-name, .seat-dot, .seat-lead, .seat-bub, .seat-num{ opacity:0; transition:opacity .45s ease .3s; }
.isl.focus .seat-name, .isl.focus .seat-dot, .isl.focus .seat-lead,
.isl.focus .seat-bub, .isl.focus .seat-num{ opacity:1; }
.seat-lead{ fill:none; stroke-width:.9; vector-effect:non-scaling-stroke; }
.seat-bub{ fill:var(--sky-0); stroke-width:1.1; vector-effect:non-scaling-stroke; transition:fill .25s; }
.seat-num{ font-family:"IBM Plex Mono",monospace; font-size:5px; text-anchor:middle; }
.seat-name{ font-family:"IBM Plex Mono",monospace; font-size:5.6px; letter-spacing:.16em; }
.seat-tag{ cursor:pointer; }
.seat-tag:focus{ outline:none; }
.seat-tag:focus-visible .seat-bub{ stroke-width:2.6; }
.seat-tag:hover .seat-bub, .seat-tag.on .seat-bub{ fill:var(--sky-0); stroke-width:2; }
.isl.mode-seat .seat-tag{ opacity:.3; transition:opacity .4s ease; }
.isl.mode-seat .seat-tag.on{ opacity:1; }
.isl.mode-seat .seat{ opacity:.28; }
.isl.mode-seat .seat.on{ opacity:1; }

/* retrato de la ficha */
.portrait{ width:100%; aspect-ratio:3/4; object-fit:cover; object-position:center 18%;
           display:block; border-radius:3px; filter:grayscale(1) contrast(1.04);
           border:1px solid var(--panel-line); }
.net.mini li{ padding:11px 0; cursor:pointer; }
/* ficha de persona: el panel se ensancha y se abre a dos columnas */
.panel.person{ width:min(720px,56vw); }
.pgrid{ display:grid; grid-template-columns:minmax(180px,40%) 1fr; gap:clamp(18px,2.4vw,34px); align-items:start; }
.pcol{ display:flex; flex-direction:column; gap:20px; min-width:0; }
.panel.person .lead{ font-size:17px; line-height:1.65; }
.net.mini .ava{ width:38px; height:38px; }
.net.mini .d{ display:none; }
.net li[data-p]{ cursor:pointer; }
.net li[data-p]:hover .t{ color:var(--c); }

/* ---------- la red: núcleo y nodos ---------- */
.net-map{ width:100%; height:auto; max-height:130px; overflow:visible; }
.net-link{ stroke:var(--ink-soft); stroke-width:1; opacity:.4; }
.net-link.net-open{ stroke-dasharray:3 3; opacity:.28; }
.net-node{ fill:var(--c,var(--ink)); }
.net-node.net-ghost{ fill:none; stroke:var(--ink-soft); stroke-width:1; stroke-dasharray:2 2.5; opacity:.6; }
.net-cap{ font-family:"IBM Plex Mono",monospace; font-size:7px; letter-spacing:.14em;
          fill:var(--ink-soft); text-anchor:middle; opacity:.75; }
.net{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
.net li{ display:flex; gap:15px; padding:16px 0; border-top:1px solid var(--panel-line); }
.net li:first-child{ border-top:0; }
.net .ava{ width:54px; height:54px; flex:none; border-radius:50%; overflow:hidden;
           border:1px solid var(--panel-line); box-shadow:0 0 0 3px var(--sky-0), 0 0 0 4px var(--c); }
.net .ava img{ width:100%; height:100%; object-fit:cover; object-position:center 18%;
               display:block; filter:grayscale(1) contrast(1.05); }
.net .who{ display:flex; flex-direction:column; gap:3px; }
.net .area{ font-size:8.5px; letter-spacing:.18em; color:var(--c); }
.net .t{ font-family:"Metropolis",sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em; }
.net .role{ font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.1em; color:var(--ink-soft); }
.net .d{ font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin-top:4px; }

.specs{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.specs div{ display:flex; flex-direction:column; gap:5px; }
.specs .n{ font-family:"Metropolis",sans-serif; font-weight:600; font-size:19px; font-variant-numeric:tabular-nums; }
.specs .l{ font-family:"IBM Plex Mono",monospace; font-size:8.5px; letter-spacing:.16em; color:var(--ink-soft); }
.back{
  margin-top:auto; align-self:flex-start; appearance:none; background:none; cursor:pointer;

/* el nodo se lee como un registro: ubicación y estado en la misma

.rec dd.live{ display:flex; align-items:center; gap:8px; }

                      background:var(--pulse); flex:none;
                      animation:softBlink 2.2s ease-in-out infinite; }

/* ---------- celular ----------
   dos reglas de fondo: el microtexto funcional crece, el atmosférico se va;
   y el HUD deja de repartirse el ancho en dos columnas que no entran. */
@media (max-width:820px){
  .mono{ font-size:11px; }
  .items .k{ font-size:10.5px; }
  .net .role, .net .area{ font-size:10.5px; }
  .specs .l{ font-size:9.5px; }
  .block dt{ font-size:9px; }
  .block dd{ font-size:13px; }
  .chip{ font-size:10.5px; }
  .lab-btn, .back, .cta{ font-size:11px; }
  .sheets ol{ gap:14px; }

  /* el panel es una hoja que sube desde abajo */
  .pgrid{ grid-template-columns:1fr; }
  .panel{ top:auto; bottom:0; width:100%; height:auto; max-height:60%; border-left:0;
          border-top:1px solid var(--panel-line);
          transform:translateY(102%); border-radius:20px 20px 0 0; gap:16px;
          padding-bottom:calc(22px + env(safe-area-inset-bottom)); }
  .panel.open{ transform:none; }
  .panel.person{ width:100%; max-height:80%; }
  .panel.form{ max-height:84%; }
  /* asa de arrastre: dice que la hoja es una hoja */
  .panel::before{ content:""; position:absolute; top:9px; left:50%; transform:translateX(-50%);
                  width:38px; height:3px; border-radius:2px; background:var(--ink-soft);
                  opacity:.35; }

  .hud{ padding:13px 14px calc(12px + env(safe-area-inset-bottom)); }
  .hud > div{ gap:10px; }

  /* arriba: marca a la izquierda, nodo a la derecha, índice debajo */
  .hud-top{ flex-direction:column; align-items:stretch; gap:2px; }
  .brand{ gap:9px; }
  .brand .mark{ width:28px; height:28px; }
  .brand b{ font-size:19px; }
  .brand i{ font-size:8px; letter-spacing:.23em; }

  /* el nodo sale del centro: en 375px se montaba encima de la marca */
  .connect{ top:13px; left:auto; right:14px; transform:none;
            flex-direction:row; align-items:center; gap:8px; padding:8px 13px;
            border:1px solid var(--edge); border-radius:999px; background:var(--panel-bg); }
  .connect .clabel, .connect .csub{ display:none; }
  .connect .cshort{ display:block; white-space:nowrap; font-family:"IBM Plex Mono",monospace;
                    font-size:10px; letter-spacing:.17em; color:var(--ink); }
  .connect.busy .cshort{ animation:blink .9s steps(2) infinite; }
  .connect.live:not(.busy) .cshort{ animation:softBlink 1.6s ease-in-out infinite; }

  /* el índice pasa a ser una tira horizontal: las islas son demasiado
     chicas en un teléfono como para ser el único modo de navegar */
  nav.dist{ flex-direction:row; align-items:center; justify-content:flex-start; gap:0;
            overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none;
            margin:0 -14px; padding:2px 14px 0; }
  nav.dist::-webkit-scrollbar{ display:none; }
  nav.dist button{ flex:none; padding:9px 12px 9px 0; font-size:10px;
                   letter-spacing:.13em; gap:6px; }

  /* abajo: una sola columna, sin la instrumentación atmosférica */
  .hud-bot{ flex-direction:column; align-items:stretch; gap:9px; }
  #roCity, .instr, .hint{ display:none; }
  .readout{ gap:0; }
  .hintbar{ align-items:stretch; gap:0; }
  .tools{ width:100%; justify-content:space-between; gap:10px; flex-wrap:nowrap; }
  .looks{ gap:9px; }
  .looks button, .snd{ font-size:9.5px; letter-spacing:.12em; }
  .snd{ white-space:nowrap; }
  .ticks{ display:none; }
}
/* pantallas muy angostas: el índice manda, las preferencias se achican */
@media (max-width:400px){
  .looks button, .snd{ font-size:9px; letter-spacing:.08em; }
  .looks{ gap:7px; }
  .tools{ gap:7px; }
  .connect{ padding:7px 11px; }
  .connect .cshort{ font-size:9.5px; letter-spacing:.14em; }
}
/* ---------- A-401: la ventana de documento ----------

  background:var(--pulse); animation:softBlink 2.2s ease-in-out infinite; }

.det-open:hover .ob-bub, .det-open:focus-visible .ob-bub{ stroke:var(--pulse); stroke-width:1.4; }

/* óptica de cámara, fija a la pantalla y transparente al puntero */
.post{ pointer-events:none; }
.grain{ opacity:.045; mix-blend-mode:multiply; }
:root[data-look="dark"] .grain, :root[data-look="bw"] .grain{ mix-blend-mode:screen; opacity:.045; }
/* profundidad de campo: sólo con la cámara quieta, y sólo fuera del plano de foco */

/* ---------- modo captura ----------
   con ?shot= en la URL queda sólo el dibujo: ni HUD, ni panel, ni rótulos.
   Inerte sin el parámetro, así que no afecta al sitio publicado. */
html.shot .hud, html.shot .panel, html.shot .lab,
html.shot .mapstatus, html.shot #tags{ display:none !important; }
html.shot #shock{ opacity:1; }
html.shot #shock.frozen .shockring{ animation-play-state:paused; }

  *{ transition-duration:.01ms !important; }

}

html.app-hidden *, html.app-hidden *::before, html.app-hidden *::after{
  animation-play-state:paused !important;
}

/* Invisible scenery and reading views do not need decorative SVG animation. */
.isl[data-offscreen="true"] *,
html:not(.still) .walk,
html:not(.still) .beacon,
html:not(.still) .padlight,
body:not([data-view="city"]) .walk,
body:not([data-view="city"]) .beacon,

  animation-play-state:paused !important;
}

/* Closed overlays stop painting after their exit and never leave a sliver. */
.panel, .lab, .d-doc{
  visibility:hidden;
  transition-property:transform, visibility;
  transition-duration:.8s, 0s;
  transition-delay:0s, .8s;
}
.panel.open, .lab.on, .d-doc.on{
  visibility:visible;
  transition-delay:0s, 0s;
}
